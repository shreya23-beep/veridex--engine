<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAF8F5;
      color: #241E19;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #E8E2D8;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .header img {
      width: 28px;
      height: 28px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .header p {
      margin: 0;
      font-size: 11px;
      color: #756A63;
    }
    .status-box {
      background: #FFFFFF;
      border: 1px solid #E8E2D8;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #241E19;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover {
      background: #3C342C;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="VeriDex">
    <div>
      <h2>VeriDex AI</h2>
      <p>On-Device Scam Protection</p>
    </div>
  </div>

  <div class="status-box">
    <div class="status-row">
      <span style="color: #756A63;">Protection Mode:</span>
      <strong style="color: #2B6E4E;">100% Offline</strong>
    </div>
    <div class="status-row">
      <span style="color: #756A63;">AI Engine:</span>
      <span>ONNX Runtime</span>
    </div>
    <div class="status-row">
      <span style="color: #756A63;">Floating Badge:</span>
      <span style="color: #2B6E4E;">Active</span>
    </div>
  </div>

  <button class="btn" id="btnDashboard">Open Cyber-Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
